<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOBLIN SLAYER</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon/favicon.png" />
    <link rel="shortcut icon" href="./assets/img/favicon/favicon.png" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./style/standart.css" />

    <!-- Core base classes -->
    <script src="./models/core/drawable-object.class.js" defer></script>
    <script src="./models/core/movable-object.class.js" defer></script>
    <script src="./models/character/character.class.js" defer></script>
    <!-- Character core -->
    <script src="./models/character/core/character-player.class.js" defer></script>
    <!-- Character segments -->
    <script src="./models/character/segments/character-player-input.class.js" defer></script>
    <script src="./models/character/segments/character-player-jump.class.js" defer></script>
    <script src="./models/character/segments/character-player-special.class.js" defer></script>
    <script src="./models/character/segments/character-player-intro.class.js" defer></script>
    <script src="./models/character/segments/character-player-death.class.js" defer></script>
    <script src="./models/character/segments/character-player-hurt.class.js" defer></script>
    <script src="./models/character/segments/character-player-attack.class.js" defer></script>
    <script src="./models/character/segments/character-player-ground.class.js" defer></script>
    <script src="./models/character/segments/character-player-block-stomp.class.js" defer></script>
    <script src="./models/character/segments/character-player-damage.class.js" defer></script>
    <script src="./models/character/core/character-player-composed.class.js" defer></script>
    <!-- Goblins only; chickens removed -->
    <script src="./models/goblin/goblin-base.class.js" defer></script>
    <script src="./models/goblin/goblin-anim.class.js" defer></script>
    <script src="./models/goblin/goblin-combat.class.js" defer></script>
    <script src="./models/goblin/goblin-patrol.class.js" defer></script>
    <script src="./models/goblin/goblin-aggro.class.js" defer></script>
    <script src="./models/goblin/goblin.class.js" defer></script>
    <!-- Environment & terrain -->
    <script src="./models/environment/background/background-object.class.js" defer></script>
    <script src="./models/environment/background/background-sprite.class.js" defer></script>
    <script src="./models/environment/terrain/rock.class.js" defer></script>
    <script src="./models/environment/terrain/foreground-rock.class.js" defer></script>
    <!-- Character HUD -->
    <script src="./models/character/hud/character-health-bar.class.js" defer></script>
    <script src="./models/character/hud/character-block-bar.class.js" defer></script>
    <script src="./models/character/hud/character-charge-bar.class.js" defer></script>
    <!-- HUD elements -->
    <script src="./models/hud/boss-segment-health-bar.class.js" defer></script>
    <script src="./models/hud/goblin-counter-hud.class.js" defer></script>
    <!-- Items & item HUD -->
    <script src="./models/items/potion.class.js" defer></script>
    <script src="./models/items/block-potion.class.js" defer></script>
    <script src="./models/items/hud/potion-hud.class.js" defer></script>
    <script src="./models/items/hud/block-potion-hud.class.js" defer></script>
    <!-- Generators -->
    <script src="./models/generators/rock-generator.class.js" defer></script>
    <script src="./models/generators/background-rock-generator.class.js" defer></script>
    <!-- World architecture (restructured) -->
    <script src="./models/world/world-base.class.js" defer></script>
    <script src="./models/world/managers/world-render.manager.class.js" defer></script>
    <script src="./models/world/managers/world-potions.manager.class.js" defer></script>
    <script src="./models/world/managers/world-collision.manager.class.js" defer></script>
    <script src="./models/world/managers/world-intro.manager.class.js" defer></script>
    <script src="./models/world/world.class.js" defer></script>
    <script src="./models/core/keyboard.class.js" defer></script>
    <script src="./models/core/level.class.js" defer></script>
    <!-- Endboss segmented classes -->
    <script src="./models/endboss/endboss-base.class.js" defer></script>
    <script src="./models/endboss/endboss-anim.class.js" defer></script>
    <script src="./models/endboss/endboss-combat.class.js" defer></script>
    <script src="./models/endboss/endboss-move.class.js" defer></script>
    <script src="./models/endboss/endboss.class.js" defer></script>
    <script src="./models/generators/randomizer.class.js" defer></script>
    <script src="./models/generators/enemy-generator.class.js" defer></script>
    <script src="./levels/level1.js" defer></script>
    <script src="./scripts/game.js" defer></script>
    <script src="./scripts/landing.js" defer></script>


</head>

<body>

    <div id="landing" class="landing">
        <div class="bg-layers">

            <div class="layer layer-3"></div>

            <div class="layer layer-bird"></div>

            <div class="layer layer-clouds"></div>

            <div class="layer layer-2"></div>
            <div class="layer layer-1"></div>
        </div>

        <div class="hero" aria-live="polite">
            <h1 class="title">
                <span class="visually-hidden">GOBLIN SLAYER</span>
                <img class="title-logo" src="./assets/img/logos/title.png" alt="Goblin Slayer" decoding="async" />
            </h1>
            <button id="enterBtn" class="image-btn" aria-label="Enter Game">
                <span class="visually-hidden">Enter Game</span>
                <img src="./assets/img/logos/enter.png" alt="" class="btn-image" decoding="async" />
            </button>
        </div>

        <!-- Static game stage (simplified) -->
        <div id="stage" class="stage" style="display:none;">
            <canvas id="canvas" width="720" height="480"></canvas>
            <button id="startGameBtn" class="image-btn stage-start-btn" aria-label="Start Game" style="display:none;">
                <img src="./assets/img/logos/start.png" alt="" class="btn-image" decoding="async" />
            </button>
            <!-- How To Play button (initially hidden, shown together with start button) -->
            <button id="howToPlayBtn" class="image-btn stage-howto-btn" aria-label="How to Play" style="display:none;">
                <img src="./assets/img/logos/how_to_play.png" alt="" class="btn-image" decoding="async" />
            </button>
            <!-- Imprint button (initially hidden, appears with other stage buttons) -->
            <button id="imprintBtn" class="image-btn stage-imprint-btn" aria-label="Imprint / Impressum"
                style="display:none;">
                <span class="visually-hidden">Impressum</span>
                <img src="./assets/img/logos/imprint.png" alt="" class="btn-image" decoding="async" />
            </button>
            <!-- Fullscreen toggle button (initially hidden, appears with stage buttons) -->
            <button id="fullscreenBtn" class="image-btn stage-fullscreen-btn" aria-label="Fullscreen an"
                style="display:none;" data-state="off">
                <span class="visually-hidden fullscreen-label">Fullscreen an</span>
                <img src="./assets/img/logos/fullscreen.png" alt="" class="btn-image" decoding="async" />
            </button>
            <!-- Sound / Music toggle button (persists after start) -->
            <button id="muteBtn" class="image-btn stage-sound-btn" aria-label="Sound aus" style="display:none;"
                data-state="on">
                <span class="visually-hidden sound-label">Sound aus</span>
                <img src="./assets/img/logos/sound_on.png" alt="" class="btn-image" decoding="async" />
            </button>
        </div>
    </div>

</body>

</html>
